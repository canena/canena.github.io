<!DOCTYPE html>
<html lang="la">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vox Latina - Visualizer Matrix</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #020204;
            font-family: monospace; color: #a0a0c0;
        }
        #canvas {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh; z-index: 1;
        }
        #ui-layer {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%); z-index: 10;
            width: 90%; max-width: 700px;
            background: rgba(6, 6, 12, 0.9);
            padding: 15px; border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            transition: opacity 0.4s;
        }
        #ui-layer.hidden { opacity: 0.02; }
        #ui-layer.hidden:hover { opacity: 1; }
        textarea {
            width: 100%; height: 80px; background: rgba(0, 0, 0, 0.6);
            border: 1px solid #223; color: #fff; padding: 8px;
            border-radius: 4px; resize: none; font-family: inherit;
        }
        .controls {
            display: flex; justify-content: space-between; align-items: center; margin-top: 8px;
        }
        button {
            background: #121e36; color: #fff; border: 1px solid #2a3a5a;
            padding: 6px 12px; border-radius: 4px; cursor: pointer; font-family: inherit;
        }
        button:hover { background: #1a2a4a; }
        .stats { font-size: 11px; color: #557; }
    </style>
    <script src="./gl-matrix-3.4.3.development.js"></script>
    <x-script src="./gl-matrix-3.4.3.js"></x-script>

const DECL = {
    1: { arum:[['gen','pl']], am:[['acc','sg']], as:[['acc','pl']], ae:[['gen','sg'],['dat','sg']], a:[['nom','sg'],['abl','sg']] },
    2: { orum:[['gen','pl']], us:[['nom','sg']], um:[['acc','sg']], i:[['gen','sg']], o:[['dat','sg'],['abl','sg']], a:[['nom','pl']] },
    3: { ibus:[['dat','pl']], ium:[['gen','pl']], um:[['gen','pl']], em:[['acc','sg']], es:[['nom','pl']], is:[['gen','sg']], e:[['abl','sg']] }
};

const grammarState = {
    nominatives: 3, genitives: 1, accusatives: 1, ablatives: 1,
    masculine: 1, feminine: 1, neuter: 1, wordCount: 7
};

function parseGrammar(text) {
    let cleanText = text.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").trim();
    if (!cleanText) return;
    let words = cleanText.split(/\s+/).filter(Boolean);

    // i) Store authentic global length metrics
    grammarState.wordCount = words.length;

    let nom = 0, gen = 0, acc = 0, abl = 0;
    let masc = 0, fem = 0, neut = 0;

    words.forEach(word => {
        let found = false;
        for (let key in LEXICON_STATIC) {
            let item = LEXICON_STATIC[key];
            if (word.startsWith(item.stem) || word === item.nom) {
                if (item.gender === 'm') masc++;
                if (item.gender === 'f') fem++;
                if (item.gender === 'n') neut++;

                const ending = word.substring(item.stem.length);
                const rules = DECL[item.decl]?.[ending] || [];
                rules.forEach(r => {
                    if (r[0] === 'nom') nom++; if (r[0] === 'gen') gen++;
                    if (r[0] === 'acc') acc++; if (r[0] === 'abl') abl++;
                });
                found = true; break;
            }
        }
        if (!found) {
            // Heuristic fallbacks for genders based on common trailing indicators
            if (word.endsWith('us') || word.endsWith('os')) masc++;
            else if (word.endsWith('am') || word.endsWith('ae') || word.endsWith('a')) fem++;
            else if (word.endsWith('um') || word.endsWith('u')) neut++;

            if (word.endsWith('orum') || word.endsWith('arum') || word.endsWith('ium')) gen++;
            else if (word.endsWith('um') || word.endsWith('am') || word.endsWith('os') || word.endsWith('as')) acc++;
            else if (word.endsWith('o') || word.endsWith('is') || word.endsWith('e')) abl++;
            else if (word.endsWith('us') || word.endsWith('a') || word.endsWith('es')) nom++;
        }
    });

    // i) Clamp the processing influence to 10 max structurally to prevent wash-outs
    grammarState.nominatives = Math.min(10, Math.max(3, nom));
    grammarState.genitives = Math.min(10, Math.max(1, gen));
    grammarState.accusatives = Math.min(10, Math.max(1, acc));
    grammarState.ablatives = Math.min(10, Math.max(1, abl));

    // Normalize gender distribution factors
    let sumG = Math.max(1, masc + fem + neut);
    grammarState.masculine = masc / sumG;
    grammarState.feminine = fem / sumG;
    grammarState.neuter = neut / sumG;

    document.getElementById('stats-out').innerText =
        `NOM: ${grammarState.nominatives} | GEN: ${grammarState.genitives} | GENDERS(M/F/N): ${masc}/${fem}/${neut}`;
}

let audioCtx = null, analyser = null, dataArrayFreq = null, dataArrayTime = null;
const audioState = { volume: 0, bass: 0, mid: 0, high: 0 };

async function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    const source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    source.connect(analyser);
    dataArrayFreq = new Uint8Array(analyser.frequencyBinCount);
    dataArrayTime = new Uint8Array(analyser.frequencyBinCount);
    document.getElementById('mic-btn').innerText = "🎙️ Engine Live";
    document.getElementById('mic-btn').disabled = true;
}

function updateAudioMetrics() {
    if (!analyser) return;
    analyser.getByteFrequencyData(dataArrayFreq);
    analyser.getByteTimeDomainData(dataArrayTime);

    let total = 0, bass = 0, mid = 0, high = 0;
    const len = dataArrayFreq.length;

    for (let i = 0; i < len; i++) {
        const val = dataArrayFreq[i] / 255.0;
        total += val;
        if (i < len * 0.15) bass += val;
        else if (i < len * 0.55) mid += val;
        else high += val;
    }

    audioState.volume = total / len;
    audioState.bass = bass / (len * 0.15);
    audioState.mid = mid / (len * 0.40);
    audioState.high = high / (len * 0.45);
}

const baseVertexSrc = `#version 300 es
in vec2 position;
out vec2 v_texCoord;
void main() {
    v_texCoord = position * 0.5 + 0.5;
    gl_Position = vec4(position, 0.0, 1.0);

const feedbackFragmentSrc = `#version 300 es
precision highp float;
in vec2 v_texCoord;
uniform sampler2D u_prevFrame;
uniform float u_time;
uniform float u_decay;
uniform float u_zoom;
uniform float u_rotate;
uniform vec2 u_shift;

// k) Gender Ratio Uniform Controls
uniform vec3 u_genderHue;

uniform vec2 u_mousePos;
uniform float u_mouseIntensity;

out vec4 fragColor;

float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
}

void main() {
    vec2 uv = v_texCoord - 0.5;

    float c = cos(u_rotate); float s = sin(u_rotate);
    uv = mat2(c, -s, s, c) * uv;
    uv *= u_zoom;
    uv += u_shift;

    vec2 sampleCoord = uv + 0.5;
    vec4 prev = texture(u_prevFrame, sampleCoord);

    // Fixed decay factor to prevent fast drop-offs into total darkness
    prev.rgb *= vec3(u_decay, u_decay * 0.98, u_decay * 0.99);

    // j) k) Vibrant Colored Plasma Nebula Background Driven by Grammatical Gender
    float plasma = sin(v_texCoord.x * 4.0 + u_time) * cos(v_texCoord.y * 4.0 - u_time) * 0.04;
    vec3 backgroundGlow = u_genderHue * (plasma + 0.025);
    prev.rgb += backgroundGlow;

    // Click / Touch interaction system
    float dist = distance(v_texCoord, u_mousePos);
    if (u_mouseIntensity > 0.01) {
        float wave = sin(dist * 40.0 - u_time * 20.0) * 0.5 + 0.5;
        float flash = wave * smoothstep(0.4, 0.0, dist) * u_mouseIntensity;
        prev.rgb += vec3(flash * 0.4, flash * 0.7, flash * 1.0);
        sampleCoord += (v_texCoord - u_mousePos) * flash * 0.03;
    }

    if(sampleCoord.x < 0.0 || sampleCoord.x > 1.0 || sampleCoord.y < 0.0 || sampleCoord.y > 1.0) {
        prev.rgb = backgroundGlow;
    }

    fragColor = vec4(prev.rgb, 1.0);
}`;

// Presentation pipeline wrapper to map dynamic pixel scaling without resets
const presentationFragmentSrc = `#version 300 es
precision highp float;
in vec2 v_texCoord;
uniform sampler2D u_bufferFrame;
uniform float u_pixelScale;
out vec4 fragColor;

void main() {
    vec2 res = vec2(textureSize(u_bufferFrame, 0));

    // h) Pixelation calculations handled elegantly in screen-space processing
    vec2 dCoord = floor(v_texCoord * res / u_pixelScale) / (res / u_pixelScale);
    fragColor = texture(u_bufferFrame, dCoord);
}`;

void main() {

        //   let gCol = cos(u - time * 1.5) * 0.5 + 0.5;
        //   let bCol = sin(u * recursions) * 0.5 + 0.5;

        //   vertexData.push(x, y, 0, rCol, gCol, bCol);
        // }
    }

    // Dynamic line stroke mapping using vocal energy ranges
    // gl.lineWidth(1.5 + Math.floor(audioState.mid * 8.0));
    // gl.lineWidth(2 + Math.floor(audioState.mid * 8.0));
    gl.lineWidth(6 + Math.floor(audioState.mid * 8.0));
    // gl.lineWidth(6 - Math.floor(audioState.mid * 8.0));

    gl.bindBuffer(gl.ARRAY_BUFFER, sceneVBO);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertexData), gl.DYNAMIC_DRAW);
    gl.bindVertexArray(sceneVAO);

    gl.enable(gl.BLEND);
    // // soft-add
    // gl.blendFuncSeparate(
    //   gl.SRC_ALPHA,
    //   gl.ONE,
    //   gl.ZERO,
    //   gl.ONE
    // );
    // screen
    gl.blendFuncSeparate(
                gl.ONE,
                gl.ONE_MINUS_SRC_COLOR,
                gl.ZERO,
                gl.ONE
            );
    // // pre-multiplied
    // gl.blendFuncSeparate(
    //             gl.ONE,
    //             gl.ONE_MINUS_SRC_ALPHA,
    //             gl.ONE,
    //             gl.ONE_MINUS_SRC_ALPHA
    //         );

    gl.drawArrays(gl.LINE_STRIP, 0, vertexData.length / 6);

    gl.disable(gl.BLEND);
}


// ==========================================
// 6. PIPELINE LOOP CONTROLLER
// ==========================================
let startTime = performance.now();
const touchState = { x: 0, y: 0, intensity: 0 };

function render() {
    requestAnimationFrame(render);
    updateAudioMetrics();

    let time = (performance.now() - startTime) * 0.001;

    // k) Overall word count maps directly to baseline global rotation speeds
    let rotationBaseMultiplier = 1.0 + (grammarState.wordCount * 0.04);
    let driftSpeed = time * rotationBaseMultiplier * (1.0 + grammarState.accusatives * 0.05);

    // let decayVal = 0.94 + Math.min(0.045, (grammarState.ablatives * 0.004));
    let decayVal = 0.96 + Math.min(0.045, (grammarState.ablatives * 0.004));
    touchState.intensity *= 0.95;

    // Phase 1: Render expanding feedback buffer matrix onto Framebuffer-B
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbB);
    gl.viewport(0, 0, width, height);

    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    gl.useProgram(feedbackProg);

    gl.uniform1i(gl.getUniformLocation(feedbackProg, "u_prevFrame"), 0);
    gl.uniform1f(gl.getUniformLocation(feedbackProg, "u_time"), time);
    gl.uniform1f(gl.getUniformLocation(feedbackProg, "u_decay"), decayVal);

    let tunnelZoom = 0.975 - (grammarState.genitives * 0.002) - (audioState.bass * 0.012);
    // let tunnelZoom = 1.002 - (grammarState.genitives * 0.002) - (audioState.bass * 0.012);
    gl.uniform1f(gl.getUniformLocation(feedbackProg, "u_zoom"), tunnelZoom);
    gl.uniform1f(gl.getUniformLocation(feedbackProg, "u_rotate"), 0.02 * rotationBaseMultiplier);
    gl.uniform2f(gl.getUniformLocation(feedbackProg, "u_shift"), Math.cos(driftSpeed)*0.002, Math.sin(driftSpeed)*0.002);

    // Feed Gender profile metrics vectors right inside background generators
    gl.uniform3f(gl.getUniformLocation(feedbackProg, "u_genderHue"), grammarState.masculine, grammarState.feminine, grammarState.neuter);
    gl.uniform2f(gl.getUniformLocation(feedbackProg, "u_mousePos"), touchState.x, touchState.y);
    gl.uniform1f(gl.getUniformLocation(feedbackProg, "u_mouseIntensity"), touchState.intensity);

    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texA);
    gl.bindVertexArray(quadVAO); gl.drawArrays(gl.TRIANGLES, 0, 6);

    // Phase 2: Layer morphing geometric vectors on top
    gl.useProgram(sceneProg);
    const matrix = mat4.create();
    mat4.ortho(matrix, -(width/height), width/height, -1, 1, -1, 1);
    mat4.rotateZ(matrix, matrix, time * 0.1 * rotationBaseMultiplier);
    gl.uniformMatrix4fv(gl.getUniformLocation(sceneProg, "u_matrix"), false, matrix);

    drawCentralGeometry(time);

    // Phase 3: Screen-space pixel shader rendering pass down to monitor view
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, width, height);
    gl.useProgram(presentationProg);

    gl.uniform1i(gl.getUniformLocation(presentationProg, "u_bufferFrame"), 0);

    // h) Dynamic pixel scaling computed on the fly natively over full textures
    // let dynamicPixelResolution = 1.5 + (audioState.bass * 8.0) - (audioState.high * 1.5);
    // let dynamicPixelResolution = 2 - (1.1 + (audioState.bass * 8.0) - (audioState.high * 1.5));
    let dynamicPixelResolution = 2.0 + (audioState.mid * 0.04) + (audioState.bass * 8.0) - (audioState.high * 1.5);
    gl.uniform1f(gl.getUniformLocation(presentationProg, "u_pixelScale"), Math.max(1.0, dynamicPixelResolution));

    gl.bindTexture(gl.TEXTURE_2D, texB);
    gl.bindVertexArray(quadVAO); gl.drawArrays(gl.TRIANGLES, 0, 6);

    // Frame swaps
    let tempTex = texA; texA = texB; texB = tempTex;
    let tempFb = fbA; fbA = fbB; fbB = tempFb;
}

function cos(v) { return Math.cos(v); }
function sin(v) { return Math.sin(v); }

// ==========================================
// 7. LISTENERS & SETUP SEEDS
// ==========================================
window.addEventListener('pointerdown', (e) => {
    if(e.target.closest('#ui-layer')) return;
    touchState.x = e.clientX / window.innerWidth;
    touchState.y = 1.0 - (e.clientY / window.innerHeight);
    touchState.intensity = 1.6;
});

const inputArea = document.getElementById('latin-input');
inputArea.addEventListener('input', (e) => parseGrammar(e.target.value));
document.getElementById('mic-btn').addEventListener('click', () => {
    initAudio().catch(err => console.error(err));
});

let uiTimer;
document.addEventListener('pointermove', () => {
    const ui = document.getElementById('ui-layer'); ui.classList.remove('hidden');
    clearTimeout(uiTimer); uiTimer = setTimeout(() => ui.classList.add('hidden'), 4000);
});

parseGrammar(inputArea.value);
gl.clearColor(0.0, 0.0, 0.0, 1.0);
requestAnimationFrame(render);
</script>
